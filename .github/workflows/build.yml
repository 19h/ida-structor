name: Build Structor Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  IDA_SDK_REPO: HexRaysSA/ida-sdk

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # IDA stable builds
          - os: macos-15-intel
            name: macos-x86_64
            cmake_arch: x86_64
            ida_ref: 70e29758997745524e917e296fbbfeef5faf9c57
            ida_suffix: ""
          - os: macos-15
            name: macos-arm64
            cmake_arch: arm64
            ida_ref: 70e29758997745524e917e296fbbfeef5faf9c57
            ida_suffix: ""
          - os: ubuntu-22.04
            name: linux-x86_64
            ida_ref: 70e29758997745524e917e296fbbfeef5faf9c57
            ida_suffix: ""
          - os: windows-2022
            name: windows-x86_64
            cmake_arch: x64
            ida_ref: 70e29758997745524e917e296fbbfeef5faf9c57
            ida_suffix: ""
          # IDA 9.3.1 release builds
          - os: macos-15-intel
            name: macos-x86_64
            cmake_arch: x86_64
            ida_ref: acacbbcc8fa349d919cc185d88b1ab3710ca252d
            ida_suffix: "-ida931"
          - os: macos-15
            name: macos-arm64
            cmake_arch: arm64
            ida_ref: acacbbcc8fa349d919cc185d88b1ab3710ca252d
            ida_suffix: "-ida931"
          - os: ubuntu-22.04
            name: linux-x86_64
            ida_ref: acacbbcc8fa349d919cc185d88b1ab3710ca252d
            ida_suffix: "-ida931"
          - os: windows-2022
            name: windows-x86_64
            cmake_arch: x64
            ida_ref: acacbbcc8fa349d919cc185d88b1ab3710ca252d
            ida_suffix: "-ida931"

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}${{ matrix.ida_suffix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned IDA SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ env.IDA_SDK_REPO }}
          ref: ${{ matrix.ida_ref }}
          path: ida-sdk
          persist-credentials: false

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.cmake_arch }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: ccache-v1-${{ runner.os }}-${{ matrix.name }}${{ matrix.ida_suffix }}-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'include/**', 'src/**', '.github/workflows/build.yml') }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ matrix.name }}${{ matrix.ida_suffix }}-

      - name: Set ccache environment (Unix)
        if: runner.os != 'Windows'
        run: |
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_MAXSIZE=1G"
          } >> "$GITHUB_ENV"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build
          cd build
          ccache --zero-stats || true
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DBUILD_TESTS=ON \
            -DSTRUCTOR_ENABLE_LIVE_TEST_HOOKS=ON \
            -DIDA_SDK_DIR=${{ github.workspace }}/ida-sdk/src

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build
          cd build
          ccache --zero-stats || true
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=ON \
            -DSTRUCTOR_ENABLE_LIVE_TEST_HOOKS=ON \
            -DIDA_SDK_DIR=${{ github.workspace }}/ida-sdk/src

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir build -Force
          cd build
          cmake .. -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON `
            -DSTRUCTOR_ENABLE_LIVE_TEST_HOOKS=ON `
            "-DIDA_SDK_DIR=${{ github.workspace }}/ida-sdk/src"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cd build
          cmake --build . --config Release \
            --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Show ccache stats (Unix)
        if: runner.os != 'Windows'
        run: ccache --show-stats || true

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build
          cmake --build . --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Rebuild and stage hook-free production plugin (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf build-production stage artifacts
          cmake -S . -B build-production \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF \
            -DSTRUCTOR_ENABLE_LIVE_TEST_HOOKS=OFF \
            -DIDA_SDK_DIR="${{ github.workspace }}/ida-sdk/src"
          cmake --build build-production --config Release \
            --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          cmake --install build-production --config Release --component Runtime \
            --prefix "${{ github.workspace }}/stage"

          if [ "${{ runner.os }}" = "macOS" ]; then
            PLUGIN_FILE="${{ github.workspace }}/stage/plugins/structor.dylib"
            EXT="dylib"
          else
            PLUGIN_FILE="${{ github.workspace }}/stage/plugins/structor.so"
            EXT="so"
          fi

          if [ ! -f "$PLUGIN_FILE" ]; then
            echo "ERROR: staged production plugin is absent: $PLUGIN_FILE"
            find stage -type f -print || true
            exit 1
          fi

          for marker in \
            STRUCTOR_INTEGRATION_TESTING \
            STRUCTOR_TEST_PERSISTENCE_FAULT \
            check_assignment_order_ctree \
            check_type_lattice_materialization \
            check_alias_flow_ctree check_flow_precision_ctree \
            inspect_instruction_semantics_identity \
            fault_global_tinfo_rollback \
            inspect_base_inference \
            inspect_existing_type_matcher \
            inspect_array_layout \
            inspect_symbolic_query_status \
            inspect_memory_inference \
            inspect_constraint_sources \
            inspect_type_model_evidence \
            inspect_signature_mapping \
            inspect_target_calling_convention \
            inspect_type_application_identity; do
            if strings "$PLUGIN_FILE" | grep -F -- "$marker"; then
              echo "ERROR: production plugin contains live-test marker: $marker"
              exit 1
            fi
          done

          if [ "${{ runner.os }}" = "macOS" ]; then
            if otool -l "$PLUGIN_FILE" | grep -q 'LC_RPATH'; then
              echo "ERROR: production plugin contains LC_RPATH"
              otool -l "$PLUGIN_FILE"
              exit 1
            fi
            if otool -L "$PLUGIN_FILE" | grep -Eiq 'z3[^[:space:]]*\.dylib'; then
              echo "ERROR: production plugin dynamically depends on Z3"
              otool -L "$PLUGIN_FILE"
              exit 1
            fi
          else
            if readelf -d "$PLUGIN_FILE" | grep -Eq '\((RPATH|RUNPATH)\)'; then
              echo "ERROR: production plugin contains RPATH/RUNPATH"
              readelf -d "$PLUGIN_FILE"
              exit 1
            fi
            if readelf -d "$PLUGIN_FILE" | grep -Eiq '\(NEEDED\).*z3.*\.so'; then
              echo "ERROR: production plugin dynamically depends on Z3"
              readelf -d "$PLUGIN_FILE"
              exit 1
            fi

            check_symbol_ceiling() {
              namespace="$1"
              ceiling="$2"
              versions=$(objdump -T "$PLUGIN_FILE" | sed -nE "s/.*\\(${namespace}_([0-9.]+)\\).*/\\1/p" | sort -Vu)
              if [ -z "$versions" ]; then
                echo "ERROR: no ${namespace} versions found; ABI ceiling parser produced no evidence"
                exit 1
              fi
              for version in $versions; do
                highest=$(printf '%s\n%s\n' "$ceiling" "$version" | sort -V | tail -n 1)
                if [ "$highest" != "$ceiling" ]; then
                  echo "ERROR: ${namespace}_${version} exceeds ${namespace}_${ceiling}"
                  exit 1
                fi
              done
            }
            check_symbol_ceiling GLIBC 2.35
            check_symbol_ceiling GLIBCXX 3.4.30
          fi

          mkdir -p artifacts
          cp "$PLUGIN_FILE" "artifacts/structor${{ matrix.ida_suffix }}_${{ matrix.name }}.${EXT}"

      - name: Rebuild and stage hook-free production plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build-production, stage, artifacts -ErrorAction SilentlyContinue
          cmake -S . -B build-production -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF `
            -DSTRUCTOR_ENABLE_LIVE_TEST_HOOKS=OFF `
            "-DIDA_SDK_DIR=${{ github.workspace }}/ida-sdk/src"
          cmake --build build-production --config Release
          cmake --install build-production --config Release --component Runtime `
            --prefix "${{ github.workspace }}/stage"

          $plugin = "${{ github.workspace }}/stage/plugins/structor.dll"
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
            Write-Error "Staged production plugin is absent: $plugin"
            Get-ChildItem -Path stage -Recurse -File -ErrorAction SilentlyContinue
            exit 1
          }

          $ascii = [System.Text.Encoding]::ASCII.GetString(
            [System.IO.File]::ReadAllBytes($plugin))
          foreach ($marker in @(
              "STRUCTOR_INTEGRATION_TESTING",
              "STRUCTOR_TEST_PERSISTENCE_FAULT",
              "check_assignment_order_ctree",
              "check_type_lattice_materialization",
              "check_alias_flow_ctree",
              "check_flow_precision_ctree",
              "inspect_instruction_semantics_identity",
              "fault_global_tinfo_rollback",
              "inspect_base_inference",
              "inspect_existing_type_matcher",
              "inspect_array_layout",
              "inspect_symbolic_query_status",
              "inspect_memory_inference",
              "inspect_constraint_sources",
              "inspect_type_model_evidence",
              "inspect_signature_mapping",
              "inspect_target_calling_convention",
              "inspect_type_application_identity")) {
            if ($ascii.Contains($marker)) {
              Write-Error "Production plugin contains live-test marker: $marker"
              exit 1
            }
          }

          $dependents = (dumpbin /nologo /dependents $plugin | Out-String)
          if ($dependents -match '(?im)^\s*((VCRUNTIME|MSVCP|CONCRT|vcomp|ucrtbased)[^\s]*|[^\s]*z3[^\s]*)\.dll\s*$') {
            Write-Error "Production plugin dynamically imports an MSVC runtime or Z3"
            Write-Host $dependents
            exit 1
          }
          $headers = (dumpbin /nologo /headers $plugin | Out-String)
          if ($headers -notmatch '(?i)subsystem.*Windows GUI') {
            Write-Error "Production plugin is not linked with the WINDOWS subsystem"
            Write-Host $headers
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item $plugin "artifacts/structor${{ matrix.ida_suffix }}_${{ matrix.name }}.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structor${{ matrix.ida_suffix }}-${{ matrix.name }}
          path: artifacts/
          retention-days: 30

  live-contracts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, structor-ida-live]
    name: Licensed live contract gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned IDA SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ env.IDA_SDK_REPO }}
          ref: 70e29758997745524e917e296fbbfeef5faf9c57
          path: ida-sdk
          persist-credentials: false

      - name: Assert licensed live-test prerequisites
        shell: bash
        run: |
          command -v idump
          test -d "$HOME/.idapro"
          find "$HOME/.idapro" -maxdepth 1 -type f \
            \( -name 'ida.reg' -o -name '*.hexlic' -o -name '*.lic' \) \
            -print -quit | grep -q .

      - name: Configure hook-enabled live build
        shell: bash
        run: |
          cmake -S . -B build-live \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTS=ON \
            -DSTRUCTOR_ENABLE_LIVE_TEST_HOOKS=ON \
            -DIDA_SDK_DIR="${{ github.workspace }}/ida-sdk/src"

      - name: Build live-test plugin and tests
        shell: bash
        run: cmake --build build-live --config Release --parallel "$(sysctl -n hw.ncpu)"

      - name: Require and execute exact live suite
        shell: bash
        run: |
          ctest --test-dir build-live --build-config Release -N \
            | grep -q 'full_integrity_suite_live'
          ctest --test-dir build-live --build-config Release \
            --output-on-failure --no-tests=error \
            -R '^full_integrity_suite_live$'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, live-contracts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify release tag equals project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -nE 's/^project\(structor VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          if [ -z "$project_version" ] || [ "$tag_version" != "$project_version" ]; then
            echo "ERROR: release tag version '$tag_version' != project version '$project_version'"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          # Copy all plugin files
          find artifacts -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.dll" \) -exec cp {} release/ \;
          cp THIRD_PARTY_NOTICES.md release/
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
